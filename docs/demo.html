<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assumption ledger — replay</title>
<style>
  :root {
    --text: #1a1a1a;
    --muted: #5c5c5c;
    --rule: #d6d6d6;
    --bg: #fafafa;
    --card: #ffffff;
    --ask: #111111;
    --satisfied: #1b7f4e;
    --violated: #b42318;
    --unknown: #9a6700;
    --na: #667085;
    --on: #111111;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 18px/1.5 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 36px 28px 96px;
  }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
  h2 { font-size: 22px; font-weight: 600; margin: 0 0 12px; }
  h3 { font-size: 16px; font-weight: 600; margin: 28px 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--rule);
    padding: 10px 14px;
    text-align: left;
    cursor: pointer;
  }
  button:focus { outline: 2px solid var(--text); outline-offset: 2px; }
  button.on {
    border-color: var(--on);
    background: #fff;
    box-shadow: inset 0 0 0 1px var(--on);
  }
  .selector { margin: 20px 0 8px; }
  .claims { display: grid; gap: 8px; margin-top: 8px; }
  .claim-btn .lbl {
    display: block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .claim-btn .txt { font-size: 16px; line-height: 1.35; }
  #worked {
    width: 100%;
    padding: 16px 18px;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
  }
  .steps {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin: 28px 0 8px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
  .steps button {
    padding: 10px 8px;
    font-size: 13px;
    line-height: 1.3;
  }
  .steps .n {
    display: block;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.03em;
    margin-bottom: 2px;
  }
  #stage { margin-top: 28px; }
  .kicker {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .claim-line { font-size: 22px; line-height: 1.35; margin: 0 0 24px; }
  .slots { display: grid; gap: 14px; }
  .slot {
    border-top: 1px solid var(--rule);
    padding: 12px 0 4px;
  }
  .slot .name {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .slot .val { font-size: 24px; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em; }
  .slot .val.null { color: var(--muted); font-weight: 400; font-size: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .doc { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin: 8px 0 24px;
  }
  .metric .n {
    display: block;
    font-size: 40px;
    line-height: 1.1;
    font-weight: 600;
    letter-spacing: -0.03em;
  }
  .metric .lbl { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .status {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .status.SATISFIED { color: var(--satisfied); }
  .status.VIOLATED { color: var(--violated); }
  .status.UNKNOWN { color: var(--unknown); }
  .status.NA { color: var(--na); }
  .status.in_discipline { color: var(--satisfied); }
  .status.generic { color: var(--violated); }
  .status.unclassified { color: var(--na); }
  .entry {
    border-top: 1px solid var(--rule);
    padding: 18px 0;
  }
  .entry-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
  .ask { font-size: 22px; line-height: 1.3; font-weight: 600; color: var(--ask); }
  .worked { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 8px 0 28px; }
  .worked ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  .worked li { counter-increment: step; margin: 0 0 22px; }
  .worked li:last-child { margin-bottom: 0; }
  .worked .kicker::before { content: counter(step) " · "; }
  .worked blockquote { margin: 0; font-size: 20px; line-height: 1.4; }
  .worked .ask { font-size: 28px; line-height: 1.25; }
  .callout {
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 20px 0;
    margin: 8px 0 24px;
  }
  .callout .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
  .callout .n { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; display: block; }
  .callout .lbl { color: var(--muted); font-size: 13px; }
  tr.l2miss td { font-weight: 600; }
  .note { font-size: 16px; margin-top: 16px; }
  @media (max-width: 720px) {
    .metrics, .steps { grid-template-columns: 1fr 1fr; }
    .worked .ask, .slot .val { font-size: 22px; }
    #worked { font-size: 18px; }
  }
</style>
</head>
<body>
<main>
  <h1>Assumption ledger — replay</h1>
  <p class="muted">Saved runs, embedded. Offline. Arrow keys move between stages. A click renders at once.</p>

  <div class="selector">

  <nav class="steps" id="steps" aria-label="Pipeline stages"></nav>
  <p class="muted" id="hint">← → between stages. Click a stage to stop there.</p>

  <div id="stage"></div>
</main>

,"hit":false,"note":"no preprocessing-before-split question","l2":false},{"id":"TB07","type":"L1.4","pin":"toxicology","hit":true,"note":"A4 on the RASAR primary: chemicals already in the similarity matrix","l2":false},{"id":"TB11","type":"L1.1","pin":"SSVEP","hit":true,"note":"A1, handed over by the claim text","l2":false},{"id":"TB12","type":"L3.2","pin":"histopathology","hit":true,"note":"patient-level slide/tile split (tagged A4, not C2)","l2":false},{"id":"TB17","type":"L2","pin":"electronic health records","hit":false,"note":"nobody asked if features encode the outcome","l2":true},{"id":"TB18","type":"L1.3","pin":"psychiatric EEG","hit":true,"note":"A3 on the Zhdanov primary: feature ranking nested in folds","l2":false},{"id":"TB20","type":"L2","pin":"software security","hit":false,"note":"nobody asked if gadget tokens are a signal","l2":true}]}};
const STEPS = [
  {id: 1, name: "The claim"},
  {id: 2, name: "Retrieval"},
  {id: 3, name: "Alignment"},
  {id: 4, name: "The ledger"},
  {id: 5, name: "Conformance"}
];
const state = {run: DATA.runs[0].id, step: 1, spotlight: false};

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function run() {
  for (const r of DATA.runs) if (r.id === state.run) return r;
  return DATA.runs[0];
}
function stated(v) {
  if (v == null || v === "" || v === false) return null;
  return v;
}

function mountChrome() {
  const box = $("claims");
  box.innerHTML = DATA.runs.map(r =>
    '<button type="button" class="claim-btn' + (r.id === state.run && !state.spotlight ? " on" : "") + '" data-run="' + esc(r.id) + '">' +
    '<span class="lbl">' + esc(r.label) + '</span>' +
    '<span class="txt">' + esc(r.claim) + '</span></button>'
  ).join("");
  $("worked").className = state.spotlight ? "on" : "";
  $("steps").innerHTML = STEPS.map(s =>
    '<button type="button" class="' + (!state.spotlight && state.step === s.id ? "on" : "") + '" data-step="' + s.id + '">' +
    '<span class="n">' + s.id + '</span>' + esc(s.name) + '</button>'
  ).join("");
}

function renderSlots(r) {
  const rows = r.slots.map(s => {
    const v = stated(s.value);
    return '<div class="slot"><div class="name">' + esc(s.slot) + '</div>' +
      (v
        ? '<div class="val">' + esc(v) + '</div>'
        : '<div class="val null">not stated</div>') +
      '</div>';
  }).join("");
  return '<div class="kicker">1 · The claim</div>' +
    '<p class="claim-line">' + esc(r.claim) + '</p>' +
    '<p class="muted">' + esc(r.discipline) + '</p>' +
    '<div class="slots">' + rows + '</div>';
}

function renderRetrieval(r) {
  const c = r.retrieval.check || {};
  const docs = r.retrieval.docs || [];
  const note = c.note || r.retrieval.note || "";
  const rows = docs.map(d => {
    const lab = d.label || "unclassified";
    return '<tr><td class="doc">' + esc(d.doc_id) + '</td><td>' + esc(d.source) +
      '</td><td><span class="status ' + esc(lab) + '">' + esc(lab.replace("_", "-")) + '</span></td>' +
      '<td>' + esc(d.title) + '</td></tr>';
  }).join("");
  return '<div class="kicker">2 · Retrieval</div>' +
    '<div class="metrics">' +
      '<div class="metric"><span class="n">' + (c.in_discipline == null ? "—" : c.in_discipline) + '</span><span class="lbl">in-discipline</span></div>' +
      '<div class="metric"><span class="n">' + (c.generic == null ? "—" : c.generic) + '</span><span class="lbl">generic</span></div>' +
      '<div class="metric"><span class="n">' + docs.length + '</span><span class="lbl">documents</span></div>' +
      '<div class="metric"><span class="n">' + (c.below_floor ? "warn" : "ok") + '</span><span class="lbl">source-leg floor</span></div>' +
    '</div>' +
    (note ? '<p class="note">' + esc(note) + '</p>' : '') +
    '<table><thead><tr><th>Doc</th><th>Source</th><th>Label</th><th>Title</th></tr></thead><tbody>' +
    rows + '</tbody></table>';
}

function renderAlignment(r) {
  const a = r.alignment;
  const n = (a.admitted_ids || []).length;
  const held = (a.held_out_ids || []).length;
  const paperRows = (a.papers || []).map(p =>
    '<tr><td class="doc">' + esc(p.doc_id) + '</td>' +
    '<td class="num">' + p.mapped + '</td>' +
    '<td class="num">' + p.unmapped + '</td>' +
    '<td class="num">' + p.extraction_quality + '</td>' +
    '<td>' + (p.admitted ? "admitted" : "held out") + '</td></tr>'
  ).join("");
  const bpRows = (a.break_points || []).map(b =>
    '<tr><td>' + esc(b.slot) + '</td>' +
    '<td class="num">' + b.papers_stating + ' / n=' + b.extracted + '</td>' +
    '<td>' + (b.target_states_it ? "stated" : "silent") + '</td></tr>'
  ).join("");
  return '<div class="kicker">3 · Alignment</div>' +
    '<div class="metrics">' +
      '<div class="metric"><span class="n">' + n + '</span><span class="lbl">admitted</span></div>' +
      '<div class="metric"><span class="n">' + held + '</span><span class="lbl">held out</span></div>' +
      '<div class="metric"><span class="n">' + (a.break_points || []).length + '</span><span class="lbl">break-point slots</span></div>' +
      '<div class="metric"><span class="n">n=' + n + '</span><span class="lbl">denominator</span></div>' +
    '</div>' +
    '<p class="muted">Unmapped slots among extracted papers. Denominator is n in every cell. Do not read a count as a literature rate.</p>' +
    '<table><thead><tr><th>Slot</th><th>Stating it</th><th>Target</th></tr></thead><tbody>' +
    (bpRows || '<tr><td colspan="3">none</td></tr>') + '</tbody></table>' +
    '<h3>Mapped and unmapped, per paper</h3>' +
    '<table><thead><tr><th>Doc</th><th>Mapped</th><th>Unmapped</th><th>Extracted</th><th></th></tr></thead><tbody>' +
    paperRows + '</tbody></table>';
}

function renderLedger(r) {
  if (!r.ledger || !r.ledger.length) {
    return '<div class="kicker">4 · The ledger</div>' +
      '<p class="claim-line">' + esc(r.ledger_note || "No ledger in this saved run.") + '</p>' +
      (r.alignment && r.alignment.held_out_ids && r.alignment.held_out_ids.length
        ? '<p class="muted">Held out: ' + r.alignment.held_out_ids.map(esc).join(", ") + '</p>'
        : '');
  }
  const by = {};
  for (const e of r.ledger) {
    (by[e.axis] || (by[e.axis] = [])).push(e);
  }
  const axes = Object.keys(by);
  let html = '<div class="kicker">4 · The ledger</div>' +
    '<div class="metrics">' +
      '<div class="metric"><span class="n">' + r.ledger.length + '</span><span class="lbl">entries</span></div>' +
      '<div class="metric"><span class="n">' + axes.length + '</span><span class="lbl">axes with an entry</span></div>' +
      '<div class="metric"><span class="n">' + r.ledger.filter(e => e.status === "UNKNOWN").length + ' / ' + r.ledger.length + '</span><span class="lbl">UNKNOWN</span></div>' +
      '<div class="metric"><span class="n">' + axes[0].replace(/_/g, " ") + '</span><span class="lbl">first axis</span></div>' +
    '</div>';
  for (const axis of axes) {
    html += '<h3>' + esc(axis) + ' · ' + by[axis].length + '</h3>';
    for (const e of by[axis]) {
      html += '<article class="entry"><div class="entry-head">' +
        '<span class="status ' + esc(e.status) + '">' + esc(e.status) + '</span>' +
        (e.subtype ? '<span class="muted">' + esc(e.subtype) + '</span>' : '') +
        '<span class="doc">' + esc(e.doc_id) + '</span>' +
        (e.lines ? '<span class="muted">' + esc(e.lines) + '</span>' : '') +
        '</div><p class="ask">' + esc(e.question) + '</p></article>';
    }
  }
  return html;
}

function renderConformance() {
  const c = DATA.conformance;
  const rows = c.cases.map(row =>
    '<tr class="' + (row.l2 && !row.hit ? "l2miss" : "") + '">' +
    '<td class="doc">' + esc(row.id) + '</td>' +
    '<td>' + esc(row.type) + '</td>' +
    '<td>' + esc(row.pin) + '</td>' +
    '<td>' + (row.hit ? "yes" : "no") + (row.l2 && !row.hit ? " · L2 miss" : "") + '</td>' +
    '<td>' + esc(row.note) + '</td></tr>'
  ).join("");
  return '<div class="kicker">5 · Conformance</div>' +
    '<div class="callout">' +
      '<div class="pair">' +
        '<div><span class="n">' + esc(c.headline) + '</span><span class="lbl">conformance · never a rate</span></div>' +
        '<div><span class="n">' + esc(c.l2) + '</span><span class="lbl">L2 · the axis this project claims is most valuable</span></div>' +
      '</div>' +
      '<p>One of the five hits (TB11) was handed over by the claim text. B_legitimacy fired on neither L2 case.</p>' +
    '</div>' +
    '<div class="metrics">' +
      '<div class="metric"><span class="n">' + c.status.UNKNOWN + '</span><span class="lbl">UNKNOWN / ' + c.status.n_entries + '</span></div>' +
      '<div class="metric"><span class="n">' + c.status.SATISFIED + '</span><span class="lbl">SATISFIED</span></div>' +
      '<div class="metric"><span class="n">' + c.status.VIOLATED + '</span><span class="lbl">VIOLATED</span></div>' +
      '<div class="metric"><span class="n">' + (c.uncovered.type || "") + '</span><span class="lbl">uncovered</span></div>' +
    '</div>' +
    '<table><thead><tr><th>Id</th><th>Type</th><th>Pin</th><th>Hit</th><th>Note</th></tr></thead><tbody>' +
    rows + '</tbody></table>' +
    '<p class="note muted">TB17 and TB20 are the L2 cases. B_legitimacy fired once in 62 entries, on neither of them.</p>';
}

function renderWorked(r) {
  const w = r.worked;
  return '<section class="worked">' +
    '<div class="kicker">Why this is the question</div>' +
    '<p class="muted">' + esc(w.axis) + ' · ' + esc(w.doc_id) + '</p>' +
    '<ol>' +
      '<li><div class="kicker">What the source result depends on</div><blockquote>' + esc(w.source) + '</blockquote></li>' +
      '<li><div class="kicker">What that becomes in the target system</div><blockquote>' + esc(w.restatement) + '</blockquote></li>' +
      '<li><div class="kicker">Therefore, what to ask</div><div class="ask">' + esc(w.ask) + '</div></li>' +
    '</ol></section>';
}

function render() {
  mountChrome();
  const r = run();
  let body;
  if (state.spotlight && r.worked) body = renderWorked(r);
  else if (state.step === 1) body = renderSlots(r);
  else if (state.step === 2) body = renderRetrieval(r);
  else if (state.step === 3) body = renderAlignment(r);
  else if (state.step === 4) body = renderLedger(r);
  else body = renderConformance();
  $("stage").innerHTML = body;
}

$("claims").addEventListener("click", function (e) {
  const btn = e.target.closest("[data-run]");
  if (!btn) return;
  state.run = btn.getAttribute("data-run");
  state.spotlight = false;
  render();
});
$("steps").addEventListener("click", function (e) {
  const btn = e.target.closest("[data-step]");
  if (!btn) return;
  state.step = Number(btn.getAttribute("data-step"));
  state.spotlight = false;
  render();
});
$("worked").addEventListener("click", function () {
  state.run = "icu";
  state.spotlight = true;
  state.step = 4;
  render();
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  e.preventDefault();
  if (state.spotlight) {
    state.spotlight = false;
    state.step = e.key === "ArrowRight" ? 1 : 1;
    render();
    return;
  }
  if (e.key === "ArrowRight" && state.step < 5) state.step += 1;
  if (e.key === "ArrowLeft" && state.step > 1) state.step -= 1;
  render();
});
render();
</script>
</body>
</html>
